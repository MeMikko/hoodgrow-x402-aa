name: CI

# Runs tests on every push and PR, separate from publish.yml (release-
# triggered only) — before this, a broken commit could sit unnoticed until
# the next release actually tried to publish it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"
      - run: pytest -q
