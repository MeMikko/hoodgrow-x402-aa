name: Publish to PyPI

# Fires when a GitHub Release is published (Releases -> Draft a new
# release -> tag e.g. v0.1.0 -> Publish release) — doable entirely from a
# phone browser or the GitHub app, no local CLI needed.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the "Environment name" set on the pending publisher at
    # pypi.org -> Your projects -> Publishing -> Add a new pending
    # publisher (PyPI project name "x402-aa-wallet", owner "MeMikko",
    # repo "x402-aa-wallet-py", workflow "publish.yml", environment
    # "pypi"). PyPI trusted publishing (unlike npm's) works for a
    # project's very first release — no token to create or store at all.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # A git tag is just a label — the publish step reads whatever
      # pyproject.toml says, not the tag. Tagging vX.Y.Z without bumping
      # pyproject.toml republishes the old version and PyPI rejects it
      # (versions are immutable) — fail loudly here instead of burning a
      # release cycle discovering that in the publish step.
      - name: Verify tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag is v$TAG_VERSION but pyproject.toml version is $PKG_VERSION — bump pyproject.toml and re-tag."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The release tag is cut by hand and may point at a commit CI never
      # saw — run the suite here so an untested commit cannot reach PyPI.
      # (Versions there are immutable; a broken release cannot be replaced.)
      # For a package that signs payments from a real wallet, the spend-cap
      # regression tests are exactly what must never be skipped at release.
      - run: pip install -e ".[dev]"
      - run: pytest -q

      - run: pip install build
      - run: python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
